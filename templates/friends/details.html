{% extends 'shared/base.html' %}
{% load static %}

{% block title %}Friend Details{% endblock %}

{% block content %}
<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="card shadow-sm p-4 text-center">

                {% if friend.photo %}
                    <img src="{{ friend.photo.url }}"
                         alt="{{ friend.name }}"
                         class="rounded-circle img-fluid mx-auto mb-3"
                         style="width:150px; height:150px; object-fit:cover;">
                {% else %}
                    <img src="{% static 'friends/profile_placeholder.jpg' %}"
                         alt="{{ friend.name }}"
                         class="rounded-circle img-fluid mx-auto mb-3"
                         style="width:150px; height:150px; object-fit:cover;">
                {% endif %}

                <h2 class="mb-3">{{ friend.name }}</h2>

                <div class="mb-3">
                    <p class="mb-0"><strong>Joined:</strong> {{ friend.created_at }}</p>
                </div>

                <div class="d-flex justify-content-center gap-2 mt-3">
                    <a href="{% url 'friends:edit' friend.pk %}" class="btn btn-outline-primary">
                        Edit
                    </a>
                    <a href="{% url 'friends:delete' friend.pk %}" class="btn btn-outline-danger">
                        Delete
                    </a>
                    <a href="{% url 'friends:list' %}" class="btn btn-secondary">
                        Back
                    </a>
                </div>

            </div>

        </div>
    </div>

</div>
{% endblock %}
