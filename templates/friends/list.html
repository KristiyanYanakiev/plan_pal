{% extends 'shared/base.html' %}
{% load static %}

{% block title %}Friends{% endblock %}

{% block content %}
    <div class="container py-5">
    <div>
        <form method="GET" class="form-inline mb-4">
            <div class="input-group">
                <input type="text" name="query" class="form-control" placeholder="Search friend..." value="{{ request.GET.query|default:'' }}">
                <div class="input-group-append ms-2">
                    <button class="btn btn-outline-secondary" type="submit">Search</button>
                </div>
            </div>
        </form>
    </div>
    
        <h1 class="mb-4 text-center">Friends</h1>
    
        <div class="row g-4">
            {% for friend in friends %}
                <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                    {% include 'friends/_friend_card.html' %}
                </div>
            {% empty %}
                <p class="text-center">No friends added yet.</p>
            {% endfor %}
        </div>
    
    </div>
        
    <div class="d-flex justify-content-center align-items-center mb-4 d-grid gap-3">
        <a href="{% url 'friends:list' %}" class="btn btn-outline-secondary">
            View All Friends
        </a>
        <a href="{% url 'friends:create' %}" class="btn btn-outline-primary">
            + Add Friend
        </a>
        </div>
    
{% endblock %}
