{% extends 'shared/base.html' %}

{% block title %}Delete Proposal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6">
            <div class="card shadow-sm p-4 text-center">

                <h2 class="card-title mb-4">Delete Proposal</h2>

                <p>Are you sure you want to delete <strong>{{ proposal.title }}</strong>?</p>

                <form method="POST">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2 mt-4">
                        <button type="submit" class="btn btn-danger">
                            Delete
                        </button>
                        <a href="{% url 'proposals:details' proposal.pk %}" class="btn btn-secondary">
                            Cancel
                        </a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
