{% extends 'shared/base.html' %}
{% load static %}

{% block title %}Proposals{% endblock %}

{% block content %}
    <div class="container py-5">
    
        <h1 class="mb-4 text-center">Proposals</h1>
        <div class="row g-4">
            {% for proposal in proposals %}
                <div class="col-12 col-sm-6 col-md-4 col-lg-3">
                    {% include 'proposals/_proposal_card.html' %}
                </div>
            {% empty %}
                <p class="text-center">No proposals added yet.</p>
            {% endfor %}
        </div>
    
    </div>
    <div class="d-flex justify-content-between align-items-center mb-4">
        <a href="{% url 'proposals:create' %}" class="btn btn-outline-primary">
            + Add Proposal
        </a>
    </div>
{% endblock %}
