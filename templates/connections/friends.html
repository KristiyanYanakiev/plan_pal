{% extends 'shared/base.html' %}

{% block content %}
<div class="container mt-5">

    <h1 class="mb-4">Friends</h1>

    {% if friends %}
        <ul class="list-group">
            {% for friend in friends %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    {{ friend.username }}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>You have no friends yet.</p>
    {% endif %}

</div>
{% endblock %}
