{% extends 'shared/base.html' %}

{% block content %}
<div class="container mt-5">

    <h3>Comment</h3>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="btn btn-primary">Save</button>
        <a href="{% url 'proposals:details' object.proposal_id %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>

</div>
{% endblock %}
